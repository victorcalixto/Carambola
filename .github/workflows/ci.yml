name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libeigen3-dev

      - name: Upgrade Python packaging tools
        run: |
          python -m pip install --upgrade \
            pip \
            build \
            wheel

      - name: Install Carambola
        run: |
          python -m pip install -e .

      - name: Install test dependencies
        run: |
          python -m pip install pytest

      - name: Show environment
        run: |
          python --version
          cmake --version
          c++ --version
          python -m pip --version

      - name: Check Carambola import
        run: |
          python - <<'PY'
          import carambola

          print("Carambola version:", carambola.version())
          PY

      - name: Run test suite
        run: |
          python -m pytest
