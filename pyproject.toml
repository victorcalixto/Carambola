[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "carambola"
version = "0.1.0.dev0"
description = "Open-source structural FEM toolkit for computational design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["carambola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
